<script>
/* ★2026-09-17 まるちゃん「URLの隣に×が出て誤って閉じる」。
   LINEの中で開かれた時は、LINEの外（スマホのふつうのブラウザ）で開き直してもらう印を付けて読み直す。
   短いリンク（x.gd）は飛び先を変えられないので、印はここで付ける。
   LINEがこの印に応じない時は、そのままLINEの中で今までどおり開く（困ることは起きない）。 */
(function(){
  try{
    var ua = navigator.userAgent || '';
    /* ★ただし LINEの専用ページ（LIFF）から来た時（入口 index.html が liff=1 を付ける）は外へ出さない。
       お店のトークの中に居ないと「押したら注文をそのまま送る」が使えないため（2026-09-17 まるちゃん決定）。 */
    var liffIn = false;   /* 入口 index.html が専用ページの時に付ける印（同じタブの間だけ残る） */
    try{ liffIn = sessionStorage.getItem('tt_liff') === '1'; }catch(e){}
    if (/Line\//i.test(ua) && location.search.indexOf('openExternalBrowser=1') < 0
        && location.search.indexOf('liff=1') < 0 && !liffIn){
      window.__ttExt = true;   /* 下の「最新のページへ移る」を止める（読み直しと取り合わないように） */
      location.replace(location.pathname + (location.search ? location.search + '&' : '?') + 'openExternalBrowser=1');
    }
  }catch(e){}
})();
</script>
<script>
/* ★ここは「入口」だけ。中身は毎回 ver.txt を見て、最新の番号のページへ移る。
   こうすると、スマホに古い画面が残っていても必ず新しい画面が出る。 */
(function(){
  if (window.__ttExt) return;
  var here = '20260918132529';
  /* ★2026-09-18：専用ページ（LIFF）から来た時は、住所の後ろ（?以降・#以降）をそのまま持って移る。
     LINEがログインの証をそこに付けて来るので、捨てると中身のページがログインをやり直し、
     「ログイン→入口→中身→ログイン…」と0.5秒ごとに回り続けた（まるちゃんのスマホで発生）。 */
  var keep = '';
  try{ if (sessionStorage.getItem('tt_liff') === '1') keep = location.search + location.hash; }catch(e){}
  function go(v){ location.replace('pagech-' + v + '.html' + keep); }
  var moved = false;
  function once(v){ if (moved) return; moved = true; go(v); }
  try{
    fetch('verch.txt?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(t){ once(((t||'').trim()) || here); })
      .catch(function(){ once(here); });
  }catch(e){ once(here); }
  /* 取りに行けない時（電波が悪い等）も、4秒で今わかっている番号へ進む */
  setTimeout(function(){ once(here); }, 4000);
})();
</script>
